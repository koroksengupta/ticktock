<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Island Hopper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#5EC8F2;
    --sky-bottom:#BDEBFF;
    --sea:#2F9FD8;
    --sea-deep:#1B78B5;
    --ink:#23324A;
    --gold:#FFC83D;
    --gold-glow:rgba(255,200,61,.95);
    --go:#2FBF5B;
    --go-dark:#1E8C40;
    --stop:#F2474A;
    --stop-dark:#B52A2D;
    --font:'Fredoka', 'Comic Sans MS', 'Chalkboard SE', system-ui, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;}
  body{
    font-family:var(--font);
    color:var(--ink);
    background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bottom) 55%,var(--sea) 55.2%,var(--sea-deep) 100%);
    user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
  }
  button{font-family:var(--font);}
  .game{
    --n:11;
    --island-w:clamp(10px, calc((100vw - 32px) / var(--n) * .8), 104px);
    position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 16px 18px;
  }

  /* ---------- Sky decorations ---------- */
  .sun{position:absolute;top:13%;right:3vw;font-size:clamp(40px,7vw,80px);animation:spin 30s linear infinite;pointer-events:none;}
  .cloud{position:absolute;font-size:clamp(34px,6vw,70px);opacity:.9;pointer-events:none;animation:drift linear infinite;}
  .cloud.c1{top:9%;animation-duration:48s;}
  .cloud.c2{top:22%;animation-duration:70s;animation-delay:-30s;}
  .cloud.c3{top:4%;animation-duration:60s;animation-delay:-12s;font-size:clamp(24px,4vw,48px);}
  @keyframes drift{from{transform:translateX(-15vw)}to{transform:translateX(115vw)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .waves{position:absolute;left:0;right:0;top:55%;height:28px;pointer-events:none;
    background:radial-gradient(circle at 20px -6px,transparent 18px,rgba(255,255,255,.55) 19px,transparent 22px) 0 0/40px 28px repeat-x;
    animation:wave 3s linear infinite;}
  @keyframes wave{to{background-position:40px 0}}

  /* ---------- Top bar ---------- */
  .topbar{position:relative;z-index:5;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .topbar .left{display:flex;gap:10px;align-items:center;}
  .pill{font-size:clamp(20px,3.2vw,34px);font-weight:700;background:rgba(255,255,255,.85);border:none;border-radius:999px;padding:4px 16px;box-shadow:0 4px 0 rgba(0,0,0,.12);color:var(--ink);}
  button.pill{cursor:pointer;}
  .stars{min-width:90px;text-align:center;}
  .stars.pop{animation:pop .5s ease;}

  /* ---------- Banner ---------- */
  .banner{
    position:relative;z-index:5;margin-top:6px;
    display:flex;align-items:center;gap:14px;
    background:#fff;border-radius:28px;padding:8px 26px;
    box-shadow:0 7px 0 rgba(0,0,0,.14);
    font-size:clamp(22px,4.2vw,50px);font-weight:700;text-align:center;
    cursor:pointer;border:5px solid var(--gold);
  }
  .banner .speaker{font-size:.8em;}
  .banner .num{display:inline-flex;align-items:center;justify-content:center;min-width:1.5em;height:1.5em;padding:0 .2em;border-radius:50%;background:var(--gold);color:var(--ink);box-shadow:0 0 18px var(--gold-glow);}
  .banner.bump{animation:pop .45s ease;}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}

  .energy{position:relative;z-index:5;margin-top:10px;display:flex;gap:6px;align-items:center;
    background:rgba(255,255,255,.8);border-radius:999px;padding:2px 14px;box-shadow:0 4px 0 rgba(0,0,0,.1);
    font-size:clamp(22px,3.6vw,40px);min-height:1.4em;}
  .energy.hidden{visibility:hidden;}
  .energy span{display:inline-block;color:#F5B400;transition:filter .3s, opacity .3s, transform .3s;}
  .energy span.used{filter:grayscale(1);opacity:.28;transform:scale(.8);}
  .energy span.zap{animation:zap .4s ease;}
  @keyframes zap{0%{transform:scale(1)}50%{transform:scale(1.6) rotate(20deg)}100%{transform:scale(.8)}}
  .energy.low{animation:lowE .6s ease-in-out infinite alternate;}
  @keyframes lowE{to{background:rgba(255,228,120,.95)}}

  /* ---------- Islands ---------- */
  .world{position:relative;z-index:3;width:100%;max-width:1400px;flex:1;display:flex;align-items:center;}
  .islands{position:relative;width:100%;display:flex;justify-content:space-between;align-items:flex-end;margin-top:12vh;}
  .island{position:relative;width:var(--island-w);display:flex;flex-direction:column;align-items:center;animation:bob 3.2s ease-in-out infinite;}
  .island:nth-child(odd){animation-delay:-1.6s;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .island .top{
    width:100%;aspect-ratio:1/.42;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;
    background:radial-gradient(ellipse at 50% 25%,#8EE06A 0%,#55C241 55%,#3A9A2E 100%);
    box-shadow:inset 0 -4px 0 rgba(0,0,0,.12);position:relative;z-index:2;
  }
  .island.ten .top{background:radial-gradient(ellipse at 50% 25%,#B6F08E 0%,#3FB8A0 60%,#2A8F7C 100%);}
  .island .rock{
    width:84%;aspect-ratio:1/.62;margin-top:-6%;
    background:linear-gradient(180deg,#D59A5E 0%,#A8703D 60%,#7E5129 100%);
    clip-path:polygon(0 0,100% 0,82% 55%,58% 100%,40% 78%,18% 52%);
  }
  .island .num{
    position:absolute;top:30%;left:50%;transform:translate(-50%,-10%);z-index:3;
    width:max(18px, calc(var(--island-w)*.66));aspect-ratio:1;
    display:flex;align-items:center;justify-content:center;border-radius:50%;
    background:#fff;font-weight:700;font-size:max(11px, calc(var(--island-w)*.4));
    box-shadow:0 3px 0 rgba(0,0,0,.18);
  }
  .island.origin .num{outline:3px dashed rgba(255,255,255,.95);outline-offset:3px;}
  .island.target .top{background:radial-gradient(ellipse at 50% 25%,#FFF3B0 0%,#FFD34D 50%,#F0A500 100%);}
  .island.target .num{background:var(--gold);}
  .island.target::before{
    content:"";position:absolute;left:50%;top:10%;width:190%;aspect-ratio:1;transform:translate(-50%,-35%);
    background:radial-gradient(circle,var(--gold-glow) 0%,rgba(255,200,61,.35) 40%,transparent 68%);
    border-radius:50%;z-index:0;animation:glow 1.1s ease-in-out infinite alternate;pointer-events:none;
  }
  .island.target::after{
    content:"⭐";position:absolute;top:-78%;left:50%;transform:translateX(-50%);
    font-size:max(16px, calc(var(--island-w)*.42));animation:twinkle 1s ease-in-out infinite alternate;z-index:1;
  }
  @keyframes glow{from{opacity:.55;transform:translate(-50%,-35%) scale(.9)}to{opacity:1;transform:translate(-50%,-35%) scale(1.1)}}
  @keyframes twinkle{from{transform:translateX(-50%) scale(.85) rotate(-12deg)}to{transform:translateX(-50%) scale(1.15) rotate(12deg)}}

  /* Jump arcs: every hop leaves a "+3" / "−2" rainbow so the child sees the whole path */
  .arcs{position:absolute;left:0;bottom:100%;width:100%;overflow:visible;pointer-events:none;z-index:3;}
  .arcs path{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:9 8;animation:dash .5s linear;}
  .arcs path.plus{stroke:#fff;}
  .arcs path.minus{stroke:#FFE0E0;}
  .arcs text{font-weight:700;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round;animation:labelIn .4s ease-out;}
  .arcs text.plus{fill:var(--go-dark);}
  .arcs text.minus{fill:var(--stop-dark);}
  @keyframes dash{from{stroke-dashoffset:200;opacity:0}to{stroke-dashoffset:0;opacity:1}}
  @keyframes labelIn{from{opacity:0}to{opacity:1}}

  /* ---------- Hero ---------- */
  .hero{--dur:.5s;--hop:-120%;position:absolute;left:0;bottom:100%;z-index:4;width:var(--island-w);display:flex;justify-content:center;
    transition:transform var(--dur) cubic-bezier(.45,.05,.4,1);cursor:pointer;}
  .hero .body{font-size:max(28px, calc(var(--island-w)*.95));line-height:1;transform-origin:50% 100%;animation:idle 1.4s ease-in-out infinite;margin-bottom:-6px;filter:drop-shadow(0 5px 3px rgba(0,0,0,.25));}
  @keyframes idle{0%,100%{transform:scale(1,1)}50%{transform:scale(1.05,.95)}}
  .hero.jump .body{animation:jump var(--dur) ease-out;}
  @keyframes jump{
    0%{transform:translateY(0) scale(1.2,.75)}
    15%{transform:translateY(-10px) scale(.85,1.2)}
    50%{transform:translateY(var(--hop)) scale(1,1) rotate(12deg)}
    85%{transform:translateY(0) scale(1.25,.7)}
    100%{transform:translateY(0) scale(1,1)}
  }
  .hero.slide .body{animation:slide var(--dur) ease-in-out;}
  @keyframes slide{
    0%{transform:rotate(0) scale(1)}
    20%{transform:rotate(-18deg) scale(1.1,.9)}
    70%{transform:rotate(-18deg) translateY(-8px) scale(1.1,.9)}
    100%{transform:rotate(0) scale(1)}
  }
  .hero .wind{position:absolute;right:-60%;bottom:20%;font-size:max(20px, calc(var(--island-w)*.5));opacity:0;pointer-events:none;}
  .hero.slide .wind{animation:wind var(--dur) ease-out;}
  @keyframes wind{0%{opacity:0;transform:translateX(-20px) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translateX(40px) scale(1.4)}}
  .hero.bounce-r .body{animation:bounceR .55s ease;}
  .hero.bounce-l .body{animation:bounceL .55s ease;}
  @keyframes bounceR{0%{transform:translate(0,0)}30%{transform:translate(35%,-45%) rotate(18deg)}50%{transform:translate(-10%,0) scale(1.2,.8) rotate(-10deg)}65%{transform:translate(8%,-8%) rotate(8deg)}80%{transform:translate(-4%,0) rotate(-4deg)}100%{transform:translate(0,0)}}
  @keyframes bounceL{0%{transform:translate(0,0)}30%{transform:translate(-35%,-45%) rotate(-18deg)}50%{transform:translate(10%,0) scale(1.2,.8) rotate(10deg)}65%{transform:translate(-8%,-8%) rotate(-8deg)}80%{transform:translate(4%,0) rotate(4deg)}100%{transform:translate(0,0)}}
  .hero.dance .body{animation:dance .45s ease-in-out infinite;}
  @keyframes dance{0%,100%{transform:translateY(0) rotate(-10deg)}50%{transform:translateY(-40%) rotate(10deg) scale(1.15)}}
  .hero.sink .body{animation:sink 1.1s ease-in forwards;}
  @keyframes sink{0%{transform:translateY(0)}25%{transform:translateY(-35%) rotate(-12deg)}55%{transform:translateY(10%) rotate(10deg)}100%{transform:translateY(160%) scale(.5);opacity:0}}
  .oops{position:absolute;bottom:115%;left:50%;transform:translateX(-50%);font-size:clamp(20px,3.6vw,44px);font-weight:700;color:#fff;
    text-shadow:0 3px 0 rgba(0,0,0,.25);opacity:0;pointer-events:none;white-space:nowrap;}
  .oops.show{animation:oops .9s ease-out;}
  .oops.at-left{left:0;transform:none;--ox:0}
  .oops.at-right{left:auto;right:0;--ox:0}
  @keyframes oops{0%{opacity:0;transform:translate(var(--ox,-50%),10px) scale(.6)}25%{opacity:1;transform:translate(var(--ox,-50%),0) scale(1.15)}75%{opacity:1}100%{opacity:0;transform:translate(var(--ox,-50%),-20px)}}

  /* ---------- Buttons ---------- */
  .controls{position:relative;z-index:5;width:100%;max-width:1200px;display:flex;gap:clamp(14px,4vw,56px);justify-content:center;}
  .group{flex:1;display:flex;gap:clamp(8px,1.6vw,20px);max-width:560px;}
  .btn{
    flex:1;min-height:clamp(90px,17vh,170px);
    font-weight:700;color:#fff;
    border:none;border-radius:30px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    text-shadow:0 3px 0 rgba(0,0,0,.25);
    transition:transform .08s, box-shadow .08s, filter .2s;
    padding:6px 4px;min-width:0;
  }
  .btn .lbl{display:flex;align-items:center;gap:.25em;font-size:clamp(26px,4.6vw,58px);line-height:1;}
  .controls.many .btn .lbl{font-size:clamp(24px,4vw,52px);}
  .btn .word{font-size:clamp(14px,2vw,24px);letter-spacing:.06em;opacity:.95;}
  .btn .dots{font-size:clamp(9px,1.3vw,16px);letter-spacing:.15em;opacity:.9;line-height:1;min-height:1em;}
  .btn.minus{background:linear-gradient(180deg,#FF6B6E,var(--stop));box-shadow:0 10px 0 var(--stop-dark),0 14px 20px rgba(0,0,0,.25);}
  .btn.plus{background:linear-gradient(180deg,#52DB7A,var(--go));box-shadow:0 10px 0 var(--go-dark),0 14px 20px rgba(0,0,0,.25);}
  .btn.s2.plus{background:linear-gradient(180deg,#3FCF9A,#1FA87A);}
  .btn.s3.plus,.btn.s5.plus{background:linear-gradient(180deg,#34C3C9,#17949C);}
  .btn.s2.minus{background:linear-gradient(180deg,#FF7F5C,#EE5A36);}
  .btn.s3.minus,.btn.s5.minus{background:linear-gradient(180deg,#FF6FA0,#E0407A);}
  .btn:active,.btn.pressed{transform:translateY(8px);}
  .btn.minus:active,.btn.minus.pressed{box-shadow:0 2px 0 var(--stop-dark),0 4px 8px rgba(0,0,0,.25);}
  .btn.plus:active,.btn.plus.pressed{box-shadow:0 2px 0 var(--go-dark),0 4px 8px rgba(0,0,0,.25);}
  .btn:disabled{filter:grayscale(.5) brightness(.9);cursor:default;}
  .btn:focus-visible{outline:5px solid #fff;outline-offset:4px;}

  /* ---------- Celebration ---------- */
  #confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20;}
  .flash{position:fixed;inset:0;pointer-events:none;z-index:19;opacity:0;}
  .flash.on{animation:flash 2.4s steps(1) forwards;}
  @keyframes flash{
    0%{opacity:.45;background:#FFE14D}10%{opacity:.4;background:#FF6FB5}20%{opacity:.45;background:#5EF08A}
    30%{opacity:.4;background:#6FC8FF}40%{opacity:.45;background:#FFE14D}50%{opacity:.35;background:#C88BFF}
    60%{opacity:.3;background:#FF6FB5}70%{opacity:.2;background:#5EF08A}80%{opacity:.12;background:#FFE14D}100%{opacity:0}
  }
  .yay{position:fixed;left:50%;top:38%;z-index:21;transform:translate(-50%,-50%) scale(0);pointer-events:none;
    font-size:clamp(56px,13vw,180px);font-weight:700;color:#fff;white-space:nowrap;
    text-shadow:0 6px 0 #F0A500,0 10px 25px rgba(0,0,0,.3);}
  .yay.show{animation:yay 2.6s cubic-bezier(.2,1.6,.4,1) forwards;}
  @keyframes yay{0%{transform:translate(-50%,-50%) scale(0) rotate(-20deg)}15%{transform:translate(-50%,-50%) scale(1.1) rotate(6deg)}25%{transform:translate(-50%,-50%) scale(1) rotate(-4deg)}80%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}
  body.shaking .world{animation:worldShake .5s ease 2;}
  @keyframes worldShake{0%,100%{transform:translate(0,0)}25%{transform:translate(-6px,3px)}50%{transform:translate(6px,-3px)}75%{transform:translate(-4px,2px)}}

  /* ---------- Start screen ---------- */
  .start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.6vh;padding:16px;
    background:linear-gradient(180deg,rgba(94,200,242,.97),rgba(47,159,216,.98));overflow:auto;}
  .start h1{margin:0;font-size:clamp(40px,8vw,110px);color:#fff;text-shadow:0 6px 0 var(--sea-deep);letter-spacing:.02em;text-align:center;line-height:1;}
  .start .pals{display:flex;gap:clamp(6px,1.6vw,20px);flex-wrap:wrap;justify-content:center;}
  .start .pal{font-size:clamp(34px,6vw,72px);background:rgba(255,255,255,.35);border:4px solid transparent;border-radius:24px;padding:4px 12px;cursor:pointer;transition:transform .15s;}
  .start .pal.sel{border-color:#fff;background:rgba(255,255,255,.7);transform:scale(1.12);}
  .levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,2vw,24px);width:100%;max-width:1000px;}
  .level{position:relative;border:none;border-radius:28px;cursor:pointer;padding:14px 8px 12px;
    background:#fff;box-shadow:0 9px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;gap:6px;
    transition:transform .12s;color:var(--ink);}
  .level:active{transform:translateY(6px);box-shadow:0 3px 0 rgba(0,0,0,.18);}
  .level .ico{font-size:clamp(40px,6vw,72px);line-height:1;}
  .level .chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;}
  .level .chip{font-size:clamp(16px,2.4vw,28px);font-weight:700;color:#fff;background:var(--go);border-radius:12px;padding:0 8px;}
  .level .chip.range{background:var(--sea-deep);}
  .level .got{font-size:clamp(15px,2vw,22px);font-weight:700;opacity:.8;}
  .level.last{outline:5px solid var(--gold);outline-offset:3px;}
  .start.hide{display:none;}

  @media (orientation:portrait) and (max-width:700px){
    .islands{margin-top:4vh;}
    .rotate-tip{display:block !important;}
    .levels{grid-template-columns:repeat(2,minmax(0,1fr));}
    .controls.many{flex-direction:column;gap:18px;}
    .controls.many .group{max-width:none;}
    .controls.many .btn{min-height:74px;}
  }
  @media (max-height:500px) and (orientation:landscape){ .islands{margin-top:3vh;} }
  .rotate-tip{display:none;position:relative;z-index:5;font-size:22px;background:rgba(255,255,255,.8);border-radius:16px;padding:4px 12px;}

  @media (prefers-reduced-motion: reduce){
    .cloud,.sun,.waves,.island{animation:none !important;}
  }
</style>
</head>
<body>

<div class="start" id="start">
  <h1>🏝️ Island Hopper</h1>
  <div class="pals" id="pals"></div>
  <div class="levels" id="levels"></div>
</div>

<div class="game" id="game">
  <div class="sun">☀️</div>
  <div class="cloud c1">☁️</div>
  <div class="cloud c2">☁️</div>
  <div class="cloud c3">☁️</div>
  <div class="waves"></div>

  <div class="topbar">
    <div class="left">
      <button class="pill" id="homeBtn" aria-label="Home">🏠</button>
      <div class="pill stars" id="stars">⭐ 0</div>
    </div>
    <div class="rotate-tip">📱↻</div>
    <button class="pill" id="langBtn" aria-label="Language">🇬🇧 EN</button>
  </div>

  <div class="banner" id="banner" role="status" aria-live="polite" title="Tap to hear again">
    <span class="speaker">🔊</span><span id="bannerText"></span>
  </div>
  <div class="energy hidden" id="energy" aria-label="Jumps left"></div>

  <div class="world">
    <div class="islands" id="islands">
      <svg class="arcs" id="arcs" aria-hidden="true"></svg>
      <div class="hero" id="hero">
        <div class="oops" id="oops"></div>
        <div class="body" id="heroBody">🐸</div>
        <div class="wind">💨</div>
      </div>
    </div>
  </div>

  <div class="controls" id="controls"></div>
</div>

<div class="flash" id="flash"></div>
<div class="yay" id="yay">YAY! 🎉</div>
<canvas id="confetti"></canvas>

<script>
(() => {
  'use strict';

  const PALS = ['🐸', '🦘', '🐰', '🐵', '🐱', '🦄'];

  // Each level adds bigger jumps. From level 2 on, every round comes with a
  // ⚡ jump budget, so the child has to plan (e.g. +3 +3 +1 instead of seven +1s).
  const LEVELS = [
    { icon: '🌱', max: 10, steps: [1],       energy: false },
    { icon: '🌊', max: 10, steps: [1, 2],    energy: true, minDist: 2, maxMoves: 3 },
    { icon: '🌋', max: 10, steps: [1, 2, 3], energy: true, minDist: 3, maxMoves: 3 },
    { icon: '🚀', max: 20, steps: [1, 2, 5], energy: true, minDist: 3, maxMoves: 4 }
  ];

  const TEXT = {
    en: {
      ask: n => `Can you land on Island ${n}?`,
      say: (n, e) => `Can you land on island ${n}?` + (e ? ` You have ${e} ${e === 1 ? 'jump' : 'jumps'}.` : ''),
      yay: 'YAY! 🎉', perfect: 'PERFECT! 🌟',
      cheers: ['Yay! You did it!', 'Super hop!', 'Wow! Amazing!', 'Hooray!'],
      perfectSay: 'Perfect! Double star!',
      oops: 'Oops!', splash: 'Splash! 🌊', tryAgain: 'Splash! Try again!',
      boost: 'BOOST', blast: 'BLAST', voice: 'en', flag: '🇬🇧 EN'
    },
    de: {
      ask: n => `Kannst du auf Insel ${n} landen?`,
      say: (n, e) => `Kannst du auf Insel ${n} landen?` + (e ? ` Du hast ${e === 1 ? 'einen Sprung' : e + ' Sprünge'}.` : ''),
      yay: 'JUHU! 🎉', perfect: 'PERFEKT! 🌟',
      cheers: ['Juhu! Geschafft!', 'Super gehüpft!', 'Wow! Toll!', 'Hurra!'],
      perfectSay: 'Perfekt! Doppelstern!',
      oops: 'Hoppla!', splash: 'Platsch! 🌊', tryAgain: 'Platsch! Nochmal!',
      boost: 'BOOST', blast: 'BLAST', voice: 'de', flag: '🇩🇪 DE'
    }
  };

  const $ = id => document.getElementById(id);
  const gameEl = $('game'), islandsEl = $('islands'), arcsEl = $('arcs'), hero = $('hero'), heroBody = $('heroBody'), oopsEl = $('oops');
  const controlsEl = $('controls'), energyEl = $('energy');
  const banner = $('banner'), bannerText = $('bannerText'), starsEl = $('stars');

  function load(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function loadStars() {
    try { const a = JSON.parse(localStorage.getItem('ih-stars') || '[]'); return LEVELS.map((_, i) => +a[i] || 0); }
    catch (e) { return LEVELS.map(() => 0); }
  }

  const state = {
    level: Math.min(LEVELS.length - 1, Math.max(0, +load('ih-level', '0') || 0)),
    pos: 0, target: -1, roundStart: 0,
    energy: 0, energyMax: 0, minMoves: 0, moves: 0, streak: 0,
    busy: false, celebrating: false, playing: false, session: 0,
    arcs: [], buttons: [],
    stars: loadStars(),
    pal: load('ih-pal', PALS[0]), lang: load('ih-lang', 'en')
  };
  if (!PALS.includes(state.pal)) state.pal = PALS[0];
  if (!TEXT[state.lang]) state.lang = 'en';
  const L = () => TEXT[state.lang];
  const LV = () => LEVELS[state.level];

  /* ---------- Sound (Web Audio synth, no files needed) ---------- */
  let ctx = null;
  function audio() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(type, f0, f1, dur, vol = 0.3, delay = 0) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, f0, f1, vol, type = 'bandpass') {
    const a = audio(); if (!a) return;
    const t = a.currentTime;
    const buf = a.createBuffer(1, Math.floor(a.sampleRate * dur), a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type = type; f.Q.value = 1.2;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = a.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.06); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(a.destination); src.start(t);
  }
  const sfx = {
    // Bigger jumps sound bigger: higher, longer boings.
    boing(k = 1) {
      tone('sine', 180, 620 + 160 * k, 0.24 + 0.06 * k, 0.4);
      tone('triangle', 360, 800 + 200 * k, 0.2 + 0.05 * k, 0.15, 0.03);
    },
    whoosh(k = 1) { noise(0.4 + 0.08 * k, 2400, 300, 0.55); tone('sine', 700, 160, 0.35 + 0.05 * k, 0.12); },
    bonk() { tone('square', 160, 70, 0.18, 0.18); tone('sine', 90, 60, 0.25, 0.3, 0.02); },
    splash() { noise(0.9, 900, 120, 0.7, 'lowpass'); tone('sine', 420, 90, 0.5, 0.25); tone('sine', 300, 80, 0.4, 0.15, 0.25); },
    zap() { tone('square', 900, 1400, 0.06, 0.05); },
    win() {
      [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone('triangle', f, f * 1.01, 0.22, 0.28, i * 0.11));
      [1568, 2093, 2637].forEach((f, i) => tone('sine', f, f, 0.15, 0.08, 0.8 + i * 0.07));
    },
    perfect() { [1319, 1568, 2093, 2637].forEach((f, i) => tone('sine', f, f, 0.2, 0.12, 1.1 + i * 0.09)); },
    ding() { tone('sine', 1320, 1320, 0.25, 0.18); tone('sine', 1760, 1760, 0.3, 0.12, 0.08); }
  };

  /* ---------- Voice (the child may not read yet) ---------- */
  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const want = L().voice;
      const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith(want));
      if (v) u.voice = v;
      u.lang = want === 'de' ? 'de-DE' : 'en-US';
      u.rate = 0.95; u.pitch = 1.3;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  const sayRound = () => speak(L().say(state.target, LV().energy ? state.energy : 0));

  /* ---------- Helpers ---------- */
  function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

  // Fewest jumps from a to b with the level's steps, never leaving the islands.
  function fewestJumps(a, b) {
    const { max, steps } = LV();
    const dist = new Array(max + 1).fill(-1);
    const q = [a]; dist[a] = 0;
    while (q.length) {
      const x = q.shift();
      if (x === b) return dist[x];
      for (const s of steps) for (const y of [x + s, x - s]) {
        if (y >= 0 && y <= max && dist[y] < 0) { dist[y] = dist[x] + 1; q.push(y); }
      }
    }
    return Infinity;
  }

  /* ---------- Building a level ---------- */
  let islands = [];
  function buildLevel() {
    const lv = LV();
    islands.forEach(el => el.remove());
    islands = [];
    gameEl.style.setProperty('--n', lv.max + 1);
    for (let i = 0; i <= lv.max; i++) {
      const el = document.createElement('div');
      el.className = 'island' + (i % 10 === 0 && lv.max > 10 ? ' ten' : '');
      el.innerHTML = `<div class="top"></div><div class="num">${i}</div><div class="rock"></div>`;
      islandsEl.insertBefore(el, arcsEl);
      islands.push(el);
    }

    controlsEl.innerHTML = '';
    controlsEl.classList.toggle('many', lv.steps.length > 1);
    const single = lv.steps.length === 1;
    const minus = document.createElement('div'); minus.className = 'group';
    const plus = document.createElement('div'); plus.className = 'group';
    state.buttons = [];
    const mk = (s, dir) => {
      const b = document.createElement('button');
      b.className = `btn ${dir > 0 ? 'plus' : 'minus'} s${s}`;
      const n = (dir > 0 ? '+' : '−') + s;
      b.setAttribute('aria-label', n);
      const arrow = `<span>${dir > 0 ? '➡' : '⬅'}</span>`;
      b.innerHTML = `<span class="lbl">${dir < 0 ? arrow : ''}<span>${n}</span>${dir > 0 ? arrow : ''}</span>` +
        (single ? `<span class="word">${dir > 0 ? L().boost : L().blast}</span>` : `<span class="dots">${'●'.repeat(s)}</span>`);
      b.addEventListener('pointerdown', e => { e.preventDefault(); audio(); move(dir * s); });
      b.addEventListener('click', e => { if (e.detail === 0) move(dir * s); }); // keyboard Enter/Space
      state.buttons.push(b);
      return b;
    };
    [...lv.steps].reverse().forEach(s => minus.appendChild(mk(s, -1)));
    lv.steps.forEach(s => plus.appendChild(mk(s, +1)));
    controlsEl.append(minus, plus);

    state.pos = 0; state.target = -1; state.streak = 0;
    renderStars();
    snapHero();
  }

  /* ---------- Rendering ---------- */
  const centerX = i => islands[i].offsetLeft + islands[i].offsetWidth / 2;
  function placeHero() { hero.style.transform = `translateX(${islands[state.pos].offsetLeft}px)`; }
  function snapHero() {
    hero.style.transition = 'none'; placeHero(); void hero.offsetWidth;
    hero.style.transition = '';
  }
  function renderTarget() {
    islands.forEach((el, i) => {
      el.classList.toggle('target', i === state.target);
      el.classList.toggle('origin', LV().energy && i === state.roundStart && i !== state.target);
    });
    bannerText.innerHTML = L().ask(`<span class="num">${state.target}</span>`);
    restart(banner, 'bump');
  }
  function renderEnergy(zapIndex) {
    const lv = LV();
    energyEl.classList.toggle('hidden', !lv.energy);
    if (!lv.energy) { energyEl.innerHTML = ''; return; }
    energyEl.innerHTML = '';
    for (let i = 0; i < state.energyMax; i++) {
      const s = document.createElement('span');
      s.textContent = '⚡\uFE0F';
      if (i >= state.energy) s.classList.add('used');
      if (i === zapIndex) s.classList.add('zap');
      energyEl.appendChild(s);
    }
    energyEl.classList.toggle('low', state.energy === 1 && state.pos !== state.target);
  }
  function renderStars() { starsEl.textContent = `⭐ ${state.stars[state.level]}`; }
  function setButtons() { state.buttons.forEach(b => { b.disabled = state.celebrating; }); }

  function drawArcs() {
    const W = islandsEl.clientWidth;
    const iw = islands[0].offsetWidth;
    const H = Math.max(60, iw * 2.4);
    arcsEl.setAttribute('width', W); arcsEl.setAttribute('height', H);
    arcsEl.setAttribute('viewBox', `0 0 ${W} ${H}`);
    arcsEl.style.height = H + 'px';
    const fs = Math.max(16, Math.min(34, iw * 0.42));
    const seen = {};
    arcsEl.innerHTML = state.arcs.map(({ from, to }) => {
      const x1 = centerX(from), x2 = centerX(to), mx = (x1 + x2) / 2;
      const d = to - from, cls = d > 0 ? 'plus' : 'minus';
      // A hop back over the same islands climbs higher, so labels never sit on top of each other.
      const key = Math.min(from, to) + '-' + Math.max(from, to);
      const layer = seen[key] = (seen[key] ?? -1) + 1;
      const h = Math.min(H - fs - 8, Math.abs(x2 - x1) * 0.55 + 14) + layer * (fs + 6);
      const base = H - 2;
      // A quadratic curve peaks halfway to its control point, so aim the control at 2h.
      return `<path class="${cls}" d="M${x1},${base} Q${mx},${base - 2 * h} ${x2},${base}"/>` +
             `<text class="${cls}" x="${mx}" y="${base - h - 6}" font-size="${fs}">${d > 0 ? '+' : '−'}${Math.abs(d)}</text>`;
    }).join('');
  }
  function clearArcs() { state.arcs = []; arcsEl.innerHTML = ''; }

  function play(cls, ms) {
    hero.classList.remove('jump', 'slide', 'bounce-r', 'bounce-l', 'dance', 'sink');
    void hero.offsetWidth;
    hero.classList.add(cls);
    clearTimeout(play.t);
    if (ms) play.t = setTimeout(() => hero.classList.remove(cls), ms);
  }
  function oops(text) {
    oopsEl.textContent = text;
    oopsEl.classList.toggle('at-left', state.pos <= 1);
    oopsEl.classList.toggle('at-right', state.pos >= LV().max - 1);
    restart(oopsEl, 'show');
  }

  /* ---------- Game logic ---------- */
  function pickTarget() {
    const lv = LV(), pos = state.pos, prev = state.target;
    if (!lv.energy) {
      const c = [];
      for (let t = 0; t <= lv.max; t++) if (t !== pos && t !== prev && Math.abs(t - pos) <= 5) c.push(t);
      return c[(Math.random() * c.length) | 0];
    }
    const all = [], multi = [];
    for (let t = 0; t <= lv.max; t++) {
      if (t === pos || t === prev || Math.abs(t - pos) < lv.minDist) continue;
      const m = fewestJumps(pos, t);
      if (m > lv.maxMoves) continue;
      all.push(t); if (m >= 2) multi.push(t);
    }
    const pool = multi.length && Math.random() < 0.7 ? multi : all;
    if (pool.length) return pool[(Math.random() * pool.length) | 0];
    return pos === lv.max ? pos - 1 : pos + 1;
  }

  function setupEnergy() {
    // Adaptive: generous at first, tighter as the streak grows, loosens again after a splash.
    const slack = state.streak >= 4 ? 0 : state.streak >= 2 ? 1 : 2;
    state.minMoves = fewestJumps(state.roundStart, state.target);
    state.energy = state.energyMax = state.minMoves + slack;
    state.moves = 0;
  }

  function newRound() {
    state.roundStart = state.pos;
    state.target = pickTarget();
    clearArcs();
    if (LV().energy) setupEnergy(); else { state.energy = state.energyMax = 0; state.moves = 0; }
    renderTarget();
    renderEnergy();
    sayRound();
  }

  function move(d) {
    if (!state.playing || state.busy || state.celebrating) return;
    const lv = LV(), k = Math.abs(d);
    const next = state.pos + d;

    if (next < 0 || next > lv.max) {
      // Too far: lean out, wobble, spring back. Costs no ⚡.
      state.busy = true;
      sfx.bonk();
      play(d > 0 ? 'bounce-r' : 'bounce-l', 560);
      oops(L().oops);
      setTimeout(() => { state.busy = false; }, 450);
      return;
    }

    state.busy = true;
    state.arcs.push({ from: state.pos, to: next });
    state.pos = next;
    state.moves++;
    let zapIndex;
    if (lv.energy) { state.energy--; zapIndex = state.energy; sfx.zap(); }

    const dur = 0.45 + 0.04 * Math.min(k, 5);
    hero.style.setProperty('--dur', dur + 's');
    hero.style.setProperty('--hop', `${-100 - 25 * Math.min(k, 5)}%`);
    if (d > 0) { sfx.boing(k); play('jump', dur * 1000 + 40); }
    else { sfx.whoosh(k); play('slide', dur * 1000 + 60); }
    placeHero();
    drawArcs();
    renderEnergy(zapIndex);

    const session = state.session;
    setTimeout(() => {
      if (session !== state.session) return;
      state.busy = false;
      if (state.pos === state.target) celebrate();
      else if (lv.energy && state.energy <= 0) splash();
    }, dur * 1000);
  }

  function splash() {
    const session = state.session;
    state.busy = true;
    sfx.splash();
    oops(L().splash);
    play('sink');
    speak(L().tryAgain);
    state.streak = 0;
    setTimeout(() => {
      if (session !== state.session) return;
      state.pos = state.roundStart;
      snapHero();
      clearArcs();
      setupEnergy();
      renderEnergy();
      hero.style.setProperty('--dur', '.5s');
      hero.style.setProperty('--hop', '-120%');
      sfx.boing(1);
      play('jump', 540);
      state.busy = false;
      setTimeout(() => { if (session === state.session) sayRound(); }, 500);
    }, 1400);
  }

  function celebrate() {
    const session = state.session;
    state.celebrating = true; setButtons();
    const perfect = LV().energy && state.moves === state.minMoves && state.minMoves > 1;
    state.stars[state.level] += perfect ? 2 : 1;
    save('ih-stars', JSON.stringify(state.stars));
    state.streak++;
    renderStars(); restart(starsEl, 'pop');
    energyEl.classList.remove('low');
    sfx.win(); if (perfect) sfx.perfect();
    speak(perfect ? L().perfectSay : L().cheers[(Math.random() * L().cheers.length) | 0]);
    play('dance');
    const yay = $('yay'); yay.textContent = perfect ? L().perfect : L().yay; restart(yay, 'show');
    restart($('flash'), 'on');
    document.body.classList.add('shaking');
    confetti.burst(perfect ? 1.6 : 1);
    setTimeout(() => document.body.classList.remove('shaking'), 1000);

    setTimeout(() => {
      if (session !== state.session) return; // player went home / changed level meanwhile
      hero.classList.remove('dance');
      state.celebrating = false; setButtons();
      sfx.ding();
      newRound();
    }, 3000);
  }

  /* ---------- Confetti ---------- */
  const confetti = (() => {
    const cv = $('confetti'), c = cv.getContext('2d');
    const colors = ['#FFC83D', '#FF6FB5', '#5EF08A', '#6FC8FF', '#C88BFF', '#FF6B6E', '#FFFFFF'];
    const shapes = ['⭐', '🎉', '✨', '🌟'];
    let parts = [], running = false;
    function resize() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
    addEventListener('resize', resize); resize();
    function burst(mult = 1) {
      const W = innerWidth, H = innerHeight;
      const origins = [[W * 0.15, H], [W * 0.85, H], [W * 0.5, H * 0.35]];
      origins.forEach(([ox, oy], k) => {
        for (let i = 0; i < 90 * mult; i++) {
          const ang = k === 2 ? Math.random() * Math.PI * 2 : -Math.PI / 2 + (Math.random() - 0.5) * 1.1 + (k === 0 ? 0.35 : -0.35);
          const sp = (k === 2 ? 4 : 11) + Math.random() * 9;
          parts.push({
            x: ox, y: oy, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
            r: 5 + Math.random() * 7, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
            color: colors[(Math.random() * colors.length) | 0],
            emoji: Math.random() < 0.12 ? shapes[(Math.random() * shapes.length) | 0] : null,
            life: 0, max: 150 + Math.random() * 80
          });
        }
      });
      if (!running) { running = true; requestAnimationFrame(tick); }
    }
    function tick() {
      const dpr = devicePixelRatio;
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      c.clearRect(0, 0, innerWidth, innerHeight);
      parts = parts.filter(p => p.life < p.max && p.y < innerHeight + 40);
      for (const p of parts) {
        p.life++; p.vy += 0.25; p.vx *= 0.99; p.vy *= 0.99;
        p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
        c.globalAlpha = Math.max(0, 1 - p.life / p.max);
        if (p.emoji) { c.font = `${p.r * 4}px serif`; c.fillText(p.emoji, -p.r * 2, p.r); }
        else { c.fillStyle = p.color; c.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); }
        c.restore();
      }
      if (parts.length) requestAnimationFrame(tick);
      else { running = false; c.clearRect(0, 0, innerWidth, innerHeight); }
    }
    return { burst };
  })();

  /* ---------- Input ---------- */
  addEventListener('keydown', e => {
    if (!state.playing || e.repeat) return;
    const steps = LV().steps;
    const press = d => {
      const i = state.buttons.findIndex(b => b.getAttribute('aria-label') === (d > 0 ? '+' : '−') + Math.abs(d));
      if (i >= 0) restart(state.buttons[i], 'pressed'), setTimeout(() => state.buttons[i].classList.remove('pressed'), 120);
      move(d);
    };
    if (e.key === 'ArrowRight') press(+1);
    else if (e.key === 'ArrowLeft') press(-1);
    else if (/^[1-9]$/.test(e.key) && steps.includes(+e.key)) press(e.shiftKey ? -e.key : +e.key);
  });

  banner.addEventListener('click', () => { if (!state.celebrating) sayRound(); });

  hero.addEventListener('click', () => {
    if (state.busy || state.celebrating) return;
    state.pal = PALS[(PALS.indexOf(state.pal) + 1) % PALS.length];
    heroBody.textContent = state.pal; save('ih-pal', state.pal);
    sfx.boing(1); play('jump', 520);
  });

  const langBtn = $('langBtn');
  function renderLang() { langBtn.textContent = L().flag; document.documentElement.lang = state.lang; }
  langBtn.addEventListener('click', () => {
    state.lang = state.lang === 'en' ? 'de' : 'en'; save('ih-lang', state.lang);
    renderLang();
    refreshButtonWords();
    renderTarget(); sayRound();
  });
  function refreshButtonWords() {
    state.buttons.forEach(b => {
      const w = b.querySelector('.word');
      if (w) w.textContent = b.classList.contains('plus') ? L().boost : L().blast;
    });
  }

  $('homeBtn').addEventListener('click', () => {
    state.playing = false; state.session++;
    try { speechSynthesis.cancel(); } catch (e) {}
    showStart();
  });

  /* ---------- Start screen ---------- */
  const palsEl = $('pals'), levelsEl = $('levels');
  PALS.forEach(p => {
    const b = document.createElement('button');
    b.className = 'pal' + (p === state.pal ? ' sel' : '');
    b.textContent = p; b.setAttribute('aria-label', 'Pick ' + p);
    b.addEventListener('click', () => {
      state.pal = p; save('ih-pal', p); heroBody.textContent = p;
      palsEl.querySelectorAll('.pal').forEach(x => x.classList.toggle('sel', x === b));
      audio(); sfx.boing(1);
    });
    palsEl.appendChild(b);
  });
  function showStart() {
    levelsEl.innerHTML = '';
    LEVELS.forEach((lv, i) => {
      const b = document.createElement('button');
      b.className = 'level' + (i === state.level ? ' last' : '');
      b.setAttribute('aria-label', 'Level ' + (i + 1));
      b.innerHTML = `<span class="ico">${lv.icon}</span>` +
        `<span class="chips">${lv.steps.map(s => `<span class="chip">+${s}</span>`).join('')}` +
        (lv.max > 10 ? `<span class="chip range">🏝️${lv.max}</span>` : '') + `</span>` +
        `<span class="got">⭐ ${state.stars[i]}</span>`;
      b.addEventListener('click', () => startLevel(i));
      levelsEl.appendChild(b);
    });
    $('start').classList.remove('hide');
  }
  function startLevel(i) {
    audio(); sfx.ding();
    state.level = i; save('ih-level', String(i));
    state.session++;
    $('start').classList.add('hide');
    state.celebrating = false; state.busy = false;
    hero.classList.remove('dance', 'sink');
    buildLevel();
    setButtons();
    state.playing = true;
    newRound();
  }

  /* ---------- Init ---------- */
  heroBody.textContent = state.pal;
  renderLang();
  buildLevel();
  addEventListener('resize', () => { snapHero(); if (state.arcs.length) drawArcs(); });
  if ('speechSynthesis' in window) speechSynthesis.getVoices(); // warm up the voice list
  showStart();
})();
</script>
</body>
</html>
