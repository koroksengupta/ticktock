<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Island Hopper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#5EC8F2;
    --sky-bottom:#BDEBFF;
    --sea:#2F9FD8;
    --sea-deep:#1B78B5;
    --ink:#23324A;
    --gold:#FFC83D;
    --gold-glow:rgba(255,200,61,.95);
    --go:#2FBF5B;
    --go-dark:#1E8C40;
    --stop:#F2474A;
    --stop-dark:#B52A2D;
    --island-w:clamp(28px, 7.4vw, 104px);
    --font:'Fredoka', 'Comic Sans MS', 'Chalkboard SE', system-ui, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;}
  body{
    font-family:var(--font);
    color:var(--ink);
    background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bottom) 55%,var(--sea) 55.2%,var(--sea-deep) 100%);
    user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
  }
  .game{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 16px 18px;}

  /* ---------- Sky decorations ---------- */
  .sun{position:absolute;top:13%;right:3vw;font-size:clamp(40px,7vw,80px);animation:spin 30s linear infinite;pointer-events:none;}
  .cloud{position:absolute;font-size:clamp(34px,6vw,70px);opacity:.9;pointer-events:none;animation:drift linear infinite;}
  .cloud.c1{top:9%;animation-duration:48s;}
  .cloud.c2{top:22%;animation-duration:70s;animation-delay:-30s;}
  .cloud.c3{top:4%;animation-duration:60s;animation-delay:-12s;font-size:clamp(24px,4vw,48px);}
  @keyframes drift{from{transform:translateX(-15vw)}to{transform:translateX(115vw)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .waves{position:absolute;left:0;right:0;top:55%;height:28px;pointer-events:none;
    background:radial-gradient(circle at 20px -6px,transparent 18px,rgba(255,255,255,.55) 19px,transparent 22px) 0 0/40px 28px repeat-x;
    animation:wave 3s linear infinite;}
  @keyframes wave{to{background-position:40px 0}}

  /* ---------- Top bar ---------- */
  .topbar{position:relative;z-index:5;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .stars{font-size:clamp(22px,3.6vw,38px);font-weight:700;background:rgba(255,255,255,.85);border-radius:999px;padding:4px 18px;box-shadow:0 4px 0 rgba(0,0,0,.12);min-width:90px;text-align:center;}
  .stars.pop{animation:pop .5s ease;}
  .lang{font-family:var(--font);font-size:clamp(18px,2.6vw,28px);border:none;border-radius:999px;padding:6px 14px;background:rgba(255,255,255,.85);box-shadow:0 4px 0 rgba(0,0,0,.12);cursor:pointer;}

  /* ---------- Banner ---------- */
  .banner{
    position:relative;z-index:5;margin-top:6px;
    display:flex;align-items:center;gap:14px;
    background:#fff;border-radius:28px;padding:10px 26px;
    box-shadow:0 7px 0 rgba(0,0,0,.14);
    font-size:clamp(24px,4.4vw,52px);font-weight:700;text-align:center;
    cursor:pointer;border:5px solid var(--gold);
  }
  .banner .speaker{font-size:.8em;}
  .banner .num{display:inline-flex;align-items:center;justify-content:center;min-width:1.5em;height:1.5em;padding:0 .2em;border-radius:50%;background:var(--gold);color:var(--ink);box-shadow:0 0 18px var(--gold-glow);}
  .banner.bump{animation:pop .45s ease;}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}

  /* ---------- Islands ---------- */
  .world{position:relative;z-index:3;width:100%;max-width:1400px;flex:1;display:flex;align-items:center;}
  .islands{position:relative;width:100%;display:flex;justify-content:space-between;align-items:flex-end;margin-top:10vh;}
  .island{position:relative;width:var(--island-w);display:flex;flex-direction:column;align-items:center;animation:bob 3.2s ease-in-out infinite;}
  .island:nth-child(odd){animation-delay:-1.6s;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .island .top{
    width:100%;aspect-ratio:1/.42;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;
    background:radial-gradient(ellipse at 50% 25%,#8EE06A 0%,#55C241 55%,#3A9A2E 100%);
    box-shadow:inset 0 -4px 0 rgba(0,0,0,.12);position:relative;z-index:2;
  }
  .island .rock{
    width:84%;aspect-ratio:1/.62;margin-top:-6%;
    background:linear-gradient(180deg,#D59A5E 0%,#A8703D 60%,#7E5129 100%);
    clip-path:polygon(0 0,100% 0,82% 55%,58% 100%,40% 78%,18% 52%);
  }
  .island .num{
    position:absolute;top:30%;left:50%;transform:translate(-50%,-10%);z-index:3;
    width:calc(var(--island-w)*.62);height:calc(var(--island-w)*.62);
    min-width:24px;min-height:24px;
    display:flex;align-items:center;justify-content:center;border-radius:50%;
    background:#fff;font-weight:700;font-size:clamp(15px,3.4vw,46px);
    box-shadow:0 3px 0 rgba(0,0,0,.18);
  }
  .island.target .top{background:radial-gradient(ellipse at 50% 25%,#FFF3B0 0%,#FFD34D 50%,#F0A500 100%);}
  .island.target .num{background:var(--gold);}
  .island.target::before{
    content:"";position:absolute;left:50%;top:10%;width:190%;aspect-ratio:1;transform:translate(-50%,-35%);
    background:radial-gradient(circle,var(--gold-glow) 0%,rgba(255,200,61,.35) 40%,transparent 68%);
    border-radius:50%;z-index:0;animation:glow 1.1s ease-in-out infinite alternate;pointer-events:none;
  }
  .island.target::after{
    content:"⭐";position:absolute;top:-78%;left:50%;transform:translateX(-50%);
    font-size:clamp(18px,3.4vw,44px);animation:twinkle 1s ease-in-out infinite alternate;z-index:1;
  }
  @keyframes glow{from{opacity:.55;transform:translate(-50%,-35%) scale(.9)}to{opacity:1;transform:translate(-50%,-35%) scale(1.1)}}
  @keyframes twinkle{from{transform:translateX(-50%) scale(.85) rotate(-12deg)}to{transform:translateX(-50%) scale(1.15) rotate(12deg)}}
  .island.visited .top{filter:brightness(1.08);}

  /* ---------- Hero ---------- */
  .hero{position:absolute;left:0;bottom:100%;z-index:4;width:var(--island-w);display:flex;justify-content:center;
    transition:transform .5s cubic-bezier(.45,.05,.4,1);pointer-events:auto;cursor:pointer;}
  .hero .body{font-size:clamp(34px,7vw,96px);line-height:1;transform-origin:50% 100%;animation:idle 1.4s ease-in-out infinite;margin-bottom:-6px;filter:drop-shadow(0 5px 3px rgba(0,0,0,.25));}
  @keyframes idle{0%,100%{transform:scale(1,1)}50%{transform:scale(1.05,.95)}}
  .hero.jump .body{animation:jump .5s ease-out;}
  @keyframes jump{
    0%{transform:translateY(0) scale(1.2,.75)}
    15%{transform:translateY(-10px) scale(.85,1.2)}
    50%{transform:translateY(-120%) scale(1,1) rotate(12deg)}
    85%{transform:translateY(0) scale(1.25,.7)}
    100%{transform:translateY(0) scale(1,1)}
  }
  .hero.slide .body{animation:slide .5s ease-in-out;}
  @keyframes slide{
    0%{transform:rotate(0) scale(1)}
    20%{transform:rotate(-18deg) scale(1.1,.9)}
    70%{transform:rotate(-18deg) translateY(-8px) scale(1.1,.9)}
    100%{transform:rotate(0) scale(1)}
  }
  .hero .wind{position:absolute;right:-60%;bottom:20%;font-size:clamp(22px,4.4vw,60px);opacity:0;pointer-events:none;}
  .hero.slide .wind{animation:wind .55s ease-out;}
  @keyframes wind{0%{opacity:0;transform:translateX(-20px) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translateX(40px) scale(1.4)}}
  .hero.bounce-r .body{animation:bounceR .55s ease;}
  .hero.bounce-l .body{animation:bounceL .55s ease;}
  @keyframes bounceR{0%{transform:translate(0,0)}30%{transform:translate(35%,-45%) rotate(18deg)}50%{transform:translate(-10%,0) scale(1.2,.8) rotate(-10deg)}65%{transform:translate(8%,-8%) rotate(8deg)}80%{transform:translate(-4%,0) rotate(-4deg)}100%{transform:translate(0,0)}}
  @keyframes bounceL{0%{transform:translate(0,0)}30%{transform:translate(-35%,-45%) rotate(-18deg)}50%{transform:translate(10%,0) scale(1.2,.8) rotate(10deg)}65%{transform:translate(-8%,-8%) rotate(-8deg)}80%{transform:translate(4%,0) rotate(4deg)}100%{transform:translate(0,0)}}
  .hero.dance .body{animation:dance .45s ease-in-out infinite;}
  @keyframes dance{0%,100%{transform:translateY(0) rotate(-10deg)}50%{transform:translateY(-40%) rotate(10deg) scale(1.15)}}
  .oops{position:absolute;bottom:115%;left:50%;transform:translateX(-50%);font-size:clamp(20px,3.6vw,44px);font-weight:700;color:#fff;
    text-shadow:0 3px 0 rgba(0,0,0,.25);opacity:0;pointer-events:none;white-space:nowrap;}
  .oops.show{animation:oops .8s ease-out;}
  .oops.at-left{left:0;transform:none;--ox:0}
  .oops.at-right{left:auto;right:0;--ox:0}
  @keyframes oops{0%{opacity:0;transform:translate(var(--ox,-50%),10px) scale(.6)}25%{opacity:1;transform:translate(var(--ox,-50%),0) scale(1.15)}75%{opacity:1}100%{opacity:0;transform:translate(var(--ox,-50%),-20px)}}

  /* ---------- Buttons ---------- */
  .controls{position:relative;z-index:5;width:100%;max-width:1000px;display:flex;gap:clamp(14px,4vw,48px);justify-content:center;}
  .btn{
    flex:1;max-width:440px;min-height:clamp(96px,17vh,170px);
    font-family:var(--font);font-weight:700;color:#fff;
    font-size:clamp(26px,4.6vw,56px);
    border:none;border-radius:34px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:.35em;
    text-shadow:0 3px 0 rgba(0,0,0,.25);
    transition:transform .08s, box-shadow .08s, filter .2s;
  }
  .btn .arrow{font-size:1.35em;line-height:1;}
  .btn.blast{background:linear-gradient(180deg,#FF6B6E,var(--stop));box-shadow:0 10px 0 var(--stop-dark),0 14px 20px rgba(0,0,0,.25);}
  .btn.boost{background:linear-gradient(180deg,#52DB7A,var(--go));box-shadow:0 10px 0 var(--go-dark),0 14px 20px rgba(0,0,0,.25);}
  .btn:active,.btn.pressed{transform:translateY(8px);}
  .btn.blast:active,.btn.blast.pressed{box-shadow:0 2px 0 var(--stop-dark),0 4px 8px rgba(0,0,0,.25);}
  .btn.boost:active,.btn.boost.pressed{box-shadow:0 2px 0 var(--go-dark),0 4px 8px rgba(0,0,0,.25);}
  .btn:disabled{filter:grayscale(.5) brightness(.9);cursor:default;}
  .btn:focus-visible{outline:5px solid #fff;outline-offset:4px;}

  /* ---------- Celebration ---------- */
  #confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20;}
  .flash{position:fixed;inset:0;pointer-events:none;z-index:19;opacity:0;}
  .flash.on{animation:flash 2.4s steps(1) forwards;}
  @keyframes flash{
    0%{opacity:.45;background:#FFE14D}10%{opacity:.4;background:#FF6FB5}20%{opacity:.45;background:#5EF08A}
    30%{opacity:.4;background:#6FC8FF}40%{opacity:.45;background:#FFE14D}50%{opacity:.35;background:#C88BFF}
    60%{opacity:.3;background:#FF6FB5}70%{opacity:.2;background:#5EF08A}80%{opacity:.12;background:#FFE14D}100%{opacity:0}
  }
  .yay{position:fixed;left:50%;top:38%;z-index:21;transform:translate(-50%,-50%) scale(0);pointer-events:none;
    font-size:clamp(60px,14vw,190px);font-weight:700;color:#fff;white-space:nowrap;
    text-shadow:0 6px 0 #F0A500,0 10px 25px rgba(0,0,0,.3);}
  .yay.show{animation:yay 2.6s cubic-bezier(.2,1.6,.4,1) forwards;}
  @keyframes yay{0%{transform:translate(-50%,-50%) scale(0) rotate(-20deg)}15%{transform:translate(-50%,-50%) scale(1.1) rotate(6deg)}25%{transform:translate(-50%,-50%) scale(1) rotate(-4deg)}80%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}
  body.shaking .world{animation:worldShake .5s ease 2;}
  @keyframes worldShake{0%,100%{transform:translate(0,0)}25%{transform:translate(-6px,3px)}50%{transform:translate(6px,-3px)}75%{transform:translate(-4px,2px)}}

  /* ---------- Start screen ---------- */
  .start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;
    background:linear-gradient(180deg,rgba(94,200,242,.96),rgba(47,159,216,.97));}
  .start h1{margin:0;font-size:clamp(48px,10vw,130px);color:#fff;text-shadow:0 6px 0 var(--sea-deep);letter-spacing:.02em;text-align:center;line-height:1;}
  .start .pals{display:flex;gap:clamp(8px,2vw,24px);}
  .start .pal{font-size:clamp(44px,8vw,96px);background:rgba(255,255,255,.35);border:5px solid transparent;border-radius:28px;padding:6px 14px;cursor:pointer;transition:transform .15s;}
  .start .pal.sel{border-color:#fff;background:rgba(255,255,255,.7);transform:scale(1.12);}
  .start .play{font-family:var(--font);font-size:clamp(40px,7vw,90px);font-weight:700;color:#fff;border:none;border-radius:999px;padding:.2em 1.1em;cursor:pointer;
    background:linear-gradient(180deg,#52DB7A,var(--go));box-shadow:0 10px 0 var(--go-dark),0 14px 24px rgba(0,0,0,.25);animation:pulse 1.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  .start.hide{display:none;}

  @media (orientation:portrait) and (max-width:700px){
    .islands{margin-top:4vh;}
    .rotate-tip{display:block !important;}
  }
  .rotate-tip{display:none;position:relative;z-index:5;font-size:22px;background:rgba(255,255,255,.8);border-radius:16px;padding:4px 12px;}

  @media (prefers-reduced-motion: reduce){
    .cloud,.sun,.waves,.island{animation:none !important;}
  }
</style>
</head>
<body>

<div class="start" id="start">
  <h1>🏝️ Island Hopper</h1>
  <div class="pals" id="pals"></div>
  <button class="play" id="playBtn" aria-label="Play">▶ GO!</button>
</div>

<div class="game">
  <div class="sun">☀️</div>
  <div class="cloud c1">☁️</div>
  <div class="cloud c2">☁️</div>
  <div class="cloud c3">☁️</div>
  <div class="waves"></div>

  <div class="topbar">
    <div class="stars" id="stars">⭐ 0</div>
    <div class="rotate-tip">📱↻</div>
    <button class="lang" id="langBtn" aria-label="Language">🇬🇧 EN</button>
  </div>

  <div class="banner" id="banner" role="status" aria-live="polite" title="Tap to hear again">
    <span class="speaker">🔊</span><span id="bannerText"></span>
  </div>

  <div class="world">
    <div class="islands" id="islands">
      <div class="hero" id="hero">
        <div class="oops" id="oops"></div>
        <div class="body" id="heroBody">🐸</div>
        <div class="wind">💨</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn blast" id="blastBtn" aria-label="Minus one blast"><span class="arrow">⬅</span><span>-1 BLAST</span></button>
    <button class="btn boost" id="boostBtn" aria-label="Plus one boost"><span>+1 BOOST</span><span class="arrow">➡</span></button>
  </div>
</div>

<div class="flash" id="flash"></div>
<div class="yay" id="yay">YAY! 🎉</div>
<canvas id="confetti"></canvas>

<script>
(() => {
  'use strict';

  const MIN = 0, MAX = 10;
  const PALS = ['🐸', '🦘', '🐰', '🐵', '🐱', '🦄'];
  const TEXT = {
    en: { ask: n => `Can you land on Island ${n}?`, say: n => `Can you land on island ${n}?`,
          yay: 'YAY! 🎉', cheers: ['Yay! You did it!', 'Super hop!', 'Wow! Amazing!', 'Hooray!'],
          oops: 'Oops!', voice: 'en', flag: '🇬🇧 EN' },
    de: { ask: n => `Kannst du auf Insel ${n} landen?`, say: n => `Kannst du auf Insel ${n} landen?`,
          yay: 'JUHU! 🎉', cheers: ['Juhu! Geschafft!', 'Super gehüpft!', 'Wow! Toll!', 'Hurra!'],
          oops: 'Hoppla!', voice: 'de', flag: '🇩🇪 DE' }
  };

  const $ = id => document.getElementById(id);
  const islandsEl = $('islands'), hero = $('hero'), heroBody = $('heroBody'), oopsEl = $('oops');
  const boostBtn = $('boostBtn'), blastBtn = $('blastBtn');
  const banner = $('banner'), bannerText = $('bannerText'), starsEl = $('stars');

  const state = {
    pos: 0, target: -1, stars: 0, busy: false, celebrating: false,
    pal: load('ih-pal', PALS[0]), lang: load('ih-lang', 'en')
  };
  if (!PALS.includes(state.pal)) state.pal = PALS[0];
  if (!TEXT[state.lang]) state.lang = 'en';

  function load(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  /* ---------- Build islands ---------- */
  const islands = [];
  for (let i = MIN; i <= MAX; i++) {
    const el = document.createElement('div');
    el.className = 'island';
    el.innerHTML = `<div class="top"></div><div class="num">${i}</div><div class="rock"></div>`;
    islandsEl.insertBefore(el, hero);
    islands.push(el);
  }

  /* ---------- Sound (Web Audio synth, no files needed) ---------- */
  let ctx = null;
  function audio() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(type, f0, f1, dur, vol = 0.3, delay = 0) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  const sfx = {
    boing() { tone('sine', 180, 720, 0.28, 0.4); tone('triangle', 360, 900, 0.22, 0.15, 0.03); },
    whoosh() {
      const a = audio(); if (!a) return;
      const dur = 0.5, t = a.currentTime;
      const buf = a.createBuffer(1, a.sampleRate * dur, a.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const src = a.createBufferSource(); src.buffer = buf;
      const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
      bp.frequency.setValueAtTime(2400, t); bp.frequency.exponentialRampToValueAtTime(300, t + dur);
      const g = a.createGain();
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.55, t + 0.08); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(bp).connect(g).connect(a.destination); src.start(t);
      tone('sine', 700, 160, 0.4, 0.12);
    },
    bonk() { tone('square', 160, 70, 0.18, 0.18); tone('sine', 90, 60, 0.25, 0.3, 0.02); },
    win() {
      [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone('triangle', f, f * 1.01, 0.22, 0.28, i * 0.11));
      [1568, 2093, 2637].forEach((f, i) => tone('sine', f, f, 0.15, 0.08, 0.8 + i * 0.07));
    },
    ding() { tone('sine', 1320, 1320, 0.25, 0.18); tone('sine', 1760, 1760, 0.3, 0.12, 0.08); }
  };

  /* ---------- Voice (the child may not read yet) ---------- */
  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const want = TEXT[state.lang].voice;
      const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith(want));
      if (v) u.voice = v;
      u.lang = want === 'de' ? 'de-DE' : 'en-US';
      u.rate = 0.95; u.pitch = 1.3;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  /* ---------- Rendering ---------- */
  function placeHero() {
    const isl = islands[state.pos];
    hero.style.transform = `translateX(${isl.offsetLeft}px)`;
  }
  function renderTarget() {
    islands.forEach((el, i) => el.classList.toggle('target', i === state.target));
    bannerText.innerHTML = TEXT[state.lang].ask(`<span class="num">${state.target}</span>`);
    banner.classList.remove('bump'); void banner.offsetWidth; banner.classList.add('bump');
  }
  function play(cls, ms) {
    hero.classList.remove('jump', 'slide', 'bounce-r', 'bounce-l', 'dance');
    void hero.offsetWidth;
    hero.classList.add(cls);
    clearTimeout(play.t);
    if (ms) play.t = setTimeout(() => hero.classList.remove(cls), ms);
  }
  function oops() {
    oopsEl.textContent = TEXT[state.lang].oops;
    oopsEl.classList.toggle('at-left', state.pos === MIN);
    oopsEl.classList.toggle('at-right', state.pos === MAX);
    oopsEl.classList.remove('show'); void oopsEl.offsetWidth; oopsEl.classList.add('show');
  }
  function setButtons() {
    boostBtn.disabled = blastBtn.disabled = state.celebrating;
  }

  /* ---------- Game logic ---------- */
  function newTarget() {
    // Keep it winnable and fun: 1–5 hops away, never the island you're on.
    let t, tries = 0;
    do {
      t = Math.floor(Math.random() * (MAX - MIN + 1)) + MIN;
      tries++;
    } while ((t === state.pos || Math.abs(t - state.pos) > 5 || t === state.target) && tries < 200);
    if (t === state.pos) t = state.pos === MAX ? MAX - 1 : state.pos + 1;
    state.target = t;
    renderTarget();
    speak(TEXT[state.lang].say(t));
  }

  function move(dir) {
    if (state.busy || state.celebrating) return;
    const next = state.pos + dir;

    if (next < MIN || next > MAX) {
      state.busy = true;
      sfx.bonk();
      // Lean out over the edge, wobble, and spring back — no falling in the sea.
      play(dir > 0 ? 'bounce-r' : 'bounce-l', 560);
      oops();
      setTimeout(() => { state.busy = false; }, 450);
      return;
    }

    state.busy = true;
    state.pos = next;
    if (dir > 0) { sfx.boing(); play('jump', 520); }
    else { sfx.whoosh(); play('slide', 560); }
    placeHero();

    setTimeout(() => {
      state.busy = false;
      if (state.pos === state.target) celebrate();
    }, 480);
  }

  function celebrate() {
    state.celebrating = true; setButtons();
    state.stars++;
    starsEl.textContent = `⭐ ${state.stars}`;
    starsEl.classList.remove('pop'); void starsEl.offsetWidth; starsEl.classList.add('pop');
    sfx.win();
    const L = TEXT[state.lang];
    speak(L.cheers[Math.floor(Math.random() * L.cheers.length)]);
    play('dance');
    const yay = $('yay'); yay.textContent = L.yay;
    yay.classList.remove('show'); void yay.offsetWidth; yay.classList.add('show');
    const flash = $('flash'); flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');
    document.body.classList.add('shaking');
    confetti.burst();
    setTimeout(() => document.body.classList.remove('shaking'), 1000);

    setTimeout(() => {
      hero.classList.remove('dance');
      state.celebrating = false; setButtons();
      sfx.ding();
      newTarget();
    }, 3000);
  }

  /* ---------- Confetti ---------- */
  const confetti = (() => {
    const cv = $('confetti'), c = cv.getContext('2d');
    const colors = ['#FFC83D', '#FF6FB5', '#5EF08A', '#6FC8FF', '#C88BFF', '#FF6B6E', '#FFFFFF'];
    const shapes = ['⭐', '🎉', '✨', '🌟'];
    let parts = [], running = false;
    function resize() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
    addEventListener('resize', resize); resize();
    function burst() {
      const W = innerWidth, H = innerHeight;
      const origins = [[W * 0.15, H], [W * 0.85, H], [W * 0.5, H * 0.35]];
      origins.forEach(([ox, oy], k) => {
        for (let i = 0; i < 90; i++) {
          const ang = k === 2 ? Math.random() * Math.PI * 2 : -Math.PI / 2 + (Math.random() - 0.5) * 1.1 + (k === 0 ? 0.35 : -0.35);
          const sp = (k === 2 ? 4 : 11) + Math.random() * 9;
          parts.push({
            x: ox, y: oy, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
            r: 5 + Math.random() * 7, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
            color: colors[(Math.random() * colors.length) | 0],
            emoji: Math.random() < 0.12 ? shapes[(Math.random() * shapes.length) | 0] : null,
            life: 0, max: 150 + Math.random() * 80
          });
        }
      });
      if (!running) { running = true; requestAnimationFrame(tick); }
    }
    function tick() {
      const dpr = devicePixelRatio;
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      c.clearRect(0, 0, innerWidth, innerHeight);
      parts = parts.filter(p => p.life < p.max && p.y < innerHeight + 40);
      for (const p of parts) {
        p.life++; p.vy += 0.25; p.vx *= 0.99; p.vy *= 0.99;
        p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
        c.globalAlpha = Math.max(0, 1 - p.life / p.max);
        if (p.emoji) { c.font = `${p.r * 4}px serif`; c.fillText(p.emoji, -p.r * 2, p.r); }
        else { c.fillStyle = p.color; c.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); }
        c.restore();
      }
      if (parts.length) requestAnimationFrame(tick);
      else { running = false; c.clearRect(0, 0, innerWidth, innerHeight); }
    }
    return { burst };
  })();

  /* ---------- Input ---------- */
  function bindPress(btn, dir) {
    btn.addEventListener('pointerdown', e => { e.preventDefault(); audio(); move(dir); });
    btn.addEventListener('click', e => { if (e.detail === 0) move(dir); }); // keyboard "click" (Enter/Space)
  }
  bindPress(boostBtn, +1);
  bindPress(blastBtn, -1);

  addEventListener('keydown', e => {
    if ($('start').classList.contains('hide') === false) return;
    if (e.repeat) return;
    if (e.key === 'ArrowRight' || e.key === '+') { flashBtn(boostBtn); move(+1); }
    if (e.key === 'ArrowLeft' || e.key === '-') { flashBtn(blastBtn); move(-1); }
  });
  function flashBtn(b) { b.classList.add('pressed'); setTimeout(() => b.classList.remove('pressed'), 120); }

  banner.addEventListener('click', () => { if (!state.celebrating) speak(TEXT[state.lang].say(state.target)); });

  hero.addEventListener('click', () => {
    if (state.busy || state.celebrating) return;
    state.pal = PALS[(PALS.indexOf(state.pal) + 1) % PALS.length];
    heroBody.textContent = state.pal; save('ih-pal', state.pal);
    sfx.boing(); play('jump', 520);
  });

  const langBtn = $('langBtn');
  function renderLang() { langBtn.textContent = TEXT[state.lang].flag; document.documentElement.lang = state.lang; }
  langBtn.addEventListener('click', () => {
    state.lang = state.lang === 'en' ? 'de' : 'en'; save('ih-lang', state.lang);
    renderLang(); renderTarget(); speak(TEXT[state.lang].say(state.target));
  });

  /* ---------- Start screen ---------- */
  const palsEl = $('pals');
  PALS.forEach(p => {
    const b = document.createElement('button');
    b.className = 'pal' + (p === state.pal ? ' sel' : '');
    b.textContent = p; b.setAttribute('aria-label', 'Pick ' + p);
    b.addEventListener('click', () => {
      state.pal = p; save('ih-pal', p); heroBody.textContent = p;
      palsEl.querySelectorAll('.pal').forEach(x => x.classList.toggle('sel', x === b));
      audio(); sfx.boing();
    });
    palsEl.appendChild(b);
  });
  $('playBtn').addEventListener('click', () => {
    audio(); sfx.ding();
    $('start').classList.add('hide');
    placeHero();
    newTarget();
  });

  /* ---------- Init ---------- */
  heroBody.textContent = state.pal;
  renderLang();
  hero.style.transition = 'none';
  placeHero();
  requestAnimationFrame(() => { hero.style.transition = ''; });
  addEventListener('resize', () => {
    hero.style.transition = 'none'; placeHero();
    requestAnimationFrame(() => { hero.style.transition = ''; });
  });
  if ('speechSynthesis' in window) speechSynthesis.getVoices(); // warm up the voice list
  setButtons();
})();
</script>
</body>
</html>
